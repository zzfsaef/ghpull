name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners stayed queued forever on this repository: three
        # `macos-latest` jobs sat in "queued" for over ten minutes while the
        # other six finished, so the grid never completed. Linux + Windows only
        # for now; add `macos-latest` back if a runner becomes available.
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # This project has zero dependencies, so there is nothing to install and no
      # package-lock.json to commit. For the same reason `cache: npm` is intentionally
      # omitted above: it fails with "Dependencies lock file is not found".
      - name: Syntax check
        run: node tools/check-syntax.mjs

      - name: Test
        run: node --test
