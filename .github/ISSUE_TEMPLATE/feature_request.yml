name: 功能建议
description: 提出新功能、新参数或行为改进的建议
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。ghpull 的定位是**零依赖**的纯客户端多源分段下载 CLI ——
        与这个定位冲突的提议（例如引入运行时依赖）通常不会被接受，
        请在方案里说明如何在不新增依赖的前提下实现。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与 discussions，确认这不是重复建议
          required: true
        - label: 这个建议可以在不引入任何运行时依赖的前提下实现
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你遇到的实际场景与痛点（比直接描述实现方案更重要）
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的行为、CLI 参数名与语义、与现有参数（并发数、镜像、续传、校验）的交互方式
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的模块
      description: 建议主要落在哪一部分
      options:
        - 分段并发与调度
        - 多源择优与镜像
        - 断点续传
        - 停滞看门狗与超时重试
        - SHA-256 校验
        - 覆盖保护与输出路径
        - CLI 参数与输出格式
        - 文档
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有参数或外部工具能否绕过？为什么不够用？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、其他工具的做法、期望的输出样例等（可选）
    validations:
      required: false
